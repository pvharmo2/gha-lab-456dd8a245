name: "Pull Requests"
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled

jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: thehanimo/pr-title-checker@7fbfe05602bdd86f926d3fb3bccb6f3aed43bc70 # v1.4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pass_on_octokit_error: false
          configuration_path: .github/pr-title-checker-config.json
  generate-files:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        id: app-token
        continue-on-error: true # LAB DEVIATION (CVE-2026-41414 repro): upstream hard-fails the job here when no real GitHub App backs SKIM_RS_BOT_APP_ID/SKIM_RS_BOT_PRIVATE_KEY; this lab has none (UI-only provisioning impossible), so the step failure is tolerated and the checkout falls back to the write-scoped GITHUB_TOKEN. The vulnerable chain itself is untouched.
        with:
          app-id: ${{ vars.SKIM_RS_BOT_APP_ID }}
          private-key: ${{ secrets.SKIM_RS_BOT_PRIVATE_KEY }}
      - name: Checkout Git repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}
          token: ${{ steps.app-token.outputs.token || github.token }} # LAB DEVIATION: `|| github.token` fallback mirrors the upstream token-only expression when the app token exists; see note above. persist-credentials still defaults to true, so the used credential is persisted in .git/config exactly as upstream.
      - run: rustup toolchain install
      - name: Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Generate files
        run: |
          cargo run -- --man > man/man1/sk.1
          cargo run -- --shell bash > shell/completion.bash
          cargo run -- --shell zsh > shell/completion.zsh
          cargo run -- --shell fish > shell/completion.fish
          cargo run -- --shell nushell > shell/completion.nu
      - name: Push modified files
        run: |
          git branch -v
          git config user.email "skim-bot@skim-rs.github.io"
          git config user.name "Skim bot"
          git commit -am 'chore: generate completions & manpage' || exit 0
          git push
